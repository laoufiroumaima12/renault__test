spring.application.name=garage_test

server.port=8082

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.schemas=flyway
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgres
spring.main.allow-circular-references=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=172.21.214.38:9092

spring.kafka.producer.bootstrap-servers = 172.21.214.38:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.bootstrap-servers = 172.21.214.38:9092
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.group-id=garage_test


spring.kafka.listener.auto-startup=false
kafka.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:postgresql://localhost:5434/renault_test
spring.datasource.username=postgres
spring.datasource.password=admin
